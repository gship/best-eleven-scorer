flutter_native_splash:
  # Baseline/Fallback Settings (Will apply to iOS and fallback Android)
  color: "#000000"
  color_dark: "#000000"
  image: images/ship_happens_games.png
  image_dark: images/ship_happens_games.png
  
  # Platform Toggles
  android: true
  ios: true
  web: true

  # Android 12+ Settings (Uses your smaller, scaled down image)
  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: images/ship_happens_games_scaled.png
    image_dark: images/ship_happens_games_scaled.png
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"